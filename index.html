<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>どうぶつ なぞとき</title>
<style>
:root{--ink:#4b3a2f;--kira:#ffb020;--nico:#ff7fa8;--bg:#fff8ec;--ok:#38b46b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","Zen Maru Gothic","BIZ UDPGothic","Noto Sans JP",sans-serif;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
body.kira{--theme:var(--kira);background:linear-gradient(#fff6d9,#fff8ec)}
body.nico{--theme:var(--nico);background:linear-gradient(#ffe6ef,#fff8ec)}
#app{height:100%;display:flex;flex-direction:column}
header{display:none;align-items:center;gap:12px;padding:10px 16px;background:#ffffffcc;border-bottom:3px solid var(--theme,#ddd)}
header.show{display:flex}
.badge{font-weight:900;font-size:22px;padding:6px 16px;border-radius:999px;background:var(--theme);color:#fff;white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(4,44px);gap:6px;margin-left:auto}
.mini div{width:44px;height:44px;border-radius:10px;border:3px dashed #c9b9a8;background:#fff;overflow:hidden}
.mini div.got{border:3px solid var(--ink)}
.mini svg{width:100%;height:100%;display:block}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:16px;overflow:auto;text-align:center}
h1{font-size:clamp(34px,6vw,60px);margin:0;letter-spacing:.06em}
h2{font-size:clamp(28px,4.6vw,46px);margin:0;line-height:1.35}
p.sub{font-size:clamp(20px,3vw,28px);margin:0;line-height:1.5}
.big-btn{border:none;border-radius:28px;padding:18px 34px;font:inherit;font-weight:900;font-size:clamp(24px,3.6vw,36px);
  color:#fff;background:var(--theme,#ff8a3d);box-shadow:0 7px 0 #0000002a;cursor:pointer;display:inline-flex;align-items:center;gap:12px}
.big-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #0000002a}
.big-btn.sub{background:#8e9aaf}
.row{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.course{width:min(40vw,330px);border:none;border-radius:32px;padding:20px 16px 24px;font:inherit;color:#fff;cursor:pointer;box-shadow:0 8px 0 #0000002a}
.course:active{transform:translateY(5px)}
.course .ic{font-size:76px;line-height:1}
.course b{display:block;font-size:clamp(28px,4vw,40px);margin-top:6px}
.course span{display:block;font-size:18px;margin-top:4px;opacity:.95}
.course.kira{background:linear-gradient(#ffc94d,#ff9f1c)}
.course.nico{background:linear-gradient(#ff9ec0,#ff6b9b)}
.animals{display:flex;gap:6px;justify-content:center}
.animals svg{width:clamp(60px,11vw,110px);height:auto}
.place-pic{width:min(56vw,40vh,380px);height:auto;background:#fff;border-radius:34px;padding:12px;border:5px solid var(--ink)}
.place-pic svg,.qpic svg{width:100%;height:auto;display:block}
.speak{width:92px;height:92px;border-radius:50%;border:5px solid var(--ink);background:#fff;font-size:44px;cursor:pointer;flex:none;
  display:inline-flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #0000001f}
body.nico main .speak{width:116px;height:116px;font-size:56px}
.speak.playing{animation:pulse .8s infinite alternate;background:#fff3b0}
@keyframes pulse{to{transform:scale(1.1)}}
.qhead{display:flex;align-items:center;gap:18px;justify-content:center}
.qpic{width:min(70vw,44vh,460px);background:#fff;border-radius:28px;border:5px solid var(--ink);padding:10px}
.choices{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.choice{border:5px solid var(--ink);background:#fff;border-radius:28px;cursor:pointer;font:inherit;color:var(--ink);box-shadow:0 7px 0 #0000001f}
.choice:active{transform:translateY(4px)}
.choice.pic{width:min(29vw,28vh,270px);padding:10px}
.choice.pic svg{width:100%;height:auto;display:block}
.choice.word{min-width:min(26vw,200px);padding:20px 26px;font-size:clamp(40px,6vw,64px);font-weight:900;letter-spacing:.08em}
.choice.no{opacity:.3;pointer-events:none;filter:grayscale(1)}
.choice.yes{border-color:var(--ok);background:#e5ffef}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.puzzle{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(70vw,44vh,440px);background:var(--ink);padding:6px;border-radius:22px}
.puzzle div{aspect-ratio:1;background:#efe6da;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:54px;color:#c9b9a8;font-weight:900}
.puzzle svg{width:100%;height:100%;display:block}
.puzzle .pop{animation:pop .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
.ok-title{color:var(--ok)}
.small-link{position:fixed;right:12px;bottom:10px;border:none;background:#ffffffaa;color:#9a8b7d;font:inherit;font-size:15px;padding:8px 12px;border-radius:12px}
.credit{position:fixed;left:12px;bottom:10px;font-size:12px;color:#a99}
/* カメラ */
#scan{position:fixed;inset:0;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
#scan.show{display:flex}
#scan video{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
#scan .frame{position:relative;width:min(70vw,60vh);aspect-ratio:1;border:8px solid #fff;border-radius:30px;box-shadow:0 0 0 9999px #0007}
#scan .msg{position:absolute;top:24px;left:0;right:0;color:#fff;font-size:30px;font-weight:900;text-shadow:0 2px 6px #000}
#scan .close{position:absolute;bottom:28px;font-size:28px}
/* せんせい コード */
#pad{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:30}
#pad.show{display:flex}
#pad .box{background:#fff;border-radius:28px;padding:20px 24px;width:min(92vw,400px);text-align:center}
#pad .disp{font-size:44px;letter-spacing:.3em;height:60px;border-bottom:4px solid #ddd;margin:8px 0 14px}
#pad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#pad .keys button{font:inherit;font-size:34px;font-weight:900;padding:14px 0;border-radius:16px;border:3px solid #ccc;background:#fafafa;color:var(--ink)}
#pad .keys button.okk{background:var(--ok);color:#fff;border-color:var(--ok)}
#pad .err{color:#e5484d;height:26px;font-weight:900}
/* おめでとう */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:14px;height:20px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.toast{white-space:nowrap;position:fixed;left:50%;top:18%;transform:translateX(-50%);background:#fff;border:5px solid #e5484d;border-radius:24px;padding:18px 28px;font-size:30px;font-weight:900;z-index:40;box-shadow:0 10px 30px #0003}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"><span class="badge" id="badge"></span><div class="mini" id="mini"></div></header>
  <main id="main"></main>
</div>
<div id="scan"><video id="video" playsinline muted></video><div class="msg">QRコードを わくに いれてね</div><div class="frame"></div><button class="big-btn sub close" id="scanClose">とじる</button></div>
<div id="pad"><div class="box"><div style="font-size:22px;font-weight:900" id="padTitle">せんせい ようの コード</div><div class="disp" id="padDisp"></div><div class="err" id="padErr"></div>
  <div class="keys" id="padKeys"></div><button class="big-btn sub" style="margin-top:14px;font-size:22px;padding:10px 24px" id="padCancel">やめる</button></div></div>
<canvas id="cv" style="display:none"></canvas>

const PUZZLE_BG = ['#bfe6ff', '#c9f0ff', '#d6f5c4', '#e3f9cf'];
const PUZZLE_ANIMALS = ['kirin', 'zou', 'raion', 'panda'];
function puzzlePiece(i) {
  const g = i < 2 ? '#8fd16e' : '#7cc46a';
  const sky = i < 2;
  let deco = '';
  if (i === 0) deco = `<circle cx="38" cy="38" r="22" fill="#ffd84d" stroke="${O}" stroke-width="4"/>`;
  if (i === 1) deco = `<g fill="#fff" stroke="${O}" stroke-width="3"><ellipse cx="150" cy="34" rx="30" ry="14"/><ellipse cx="130" cy="28" rx="16" ry="12"/></g>`;
  const bg = sky
    ? `<rect width="200" height="200" fill="${PUZZLE_BG[i]}"/><rect y="150" width="200" height="50" fill="${g}"/>`
    : `<rect width="200" height="200" fill="${g}"/><g fill="#ffe36b" stroke="${O}" stroke-width="2"><circle cx="24" cy="178" r="6"/><circle cx="178" cy="22" r="6"/><circle cx="182" cy="176" r="6"/></g>`;
  const inner = ART[PUZZLE_ANIMALS[i]].replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
  return svg(`${bg}${deco}<g transform="translate(22 22) scale(.78)">${inner}</g>`);
}

  const spots = [[10, 14, 'usagi'], [108, 8, 'kame'], [206, 16, 'usagi'], [14, 110, 'usagi'], [110, 106, 'usagi'], [204, 112, 'kame'], [8, 206, 'kame'], [106, 204, 'usagi'], [206, 208, 'usagi']];

}

<script>
// ================= せってい（ここを かえれば 調整できます） =================
const CONFIG = {
  TEACHER_CODE: '1031',        // トンネル成功・最後の解除・QRが読めないときに先生が入れる番号
  QR_PREFIX: 'DNAZO1:',        // QRコードの中身の頭文字（ほかの謎解きのQRと区別）
  SAVE_KEY: 'doubutsu-nazo-1',
  CREDIT: '音声：VOICEVOX:No.7',
};
const PLACES = {
  nikoniko: { name: 'にこにこルーム', voice: 'go_final' },
  ongaku:   { name: 'おんがくしつ',   voice: 'go_ongaku', piece: 0 },
  taiiku:   { name: 'たいいくかん',   voice: 'go_taiiku', piece: 1 },
  play:     { name: 'プレイルーム',   voice: 'go_play',   piece: 2 },
  tosho:    { name: 'としょコーナー', voice: 'go_tosho',  piece: 3 },
};
const ROUTE_PLACES = ['ongaku', 'taiiku', 'play', 'tosho'];
// もんだい（たいいくかん は トンネル）
const QUESTIONS = {
  nico: {
    ongaku: { voice: 'nq_ongaku', text: '「わんわん」は どれ？', type: 'pic', choices: ['inu', 'neko', 'zou'], answer: 'inu' },
    play:   { voice: 'nq_play',   text: 'へびは どれ？',                 type: 'pic', choices: ['usagi', 'hebi', 'raion'], answer: 'hebi' },
    tosho:  { voice: 'nq_tosho',  text: 'ぞうは どれ？',                 type: 'pic', choices: ['panda', 'kirin', 'zou'], answer: 'zou' },
  },
  kira: {
    ongaku: { voice: 'kq_ongaku', text: '「にゃーお」は だあれ？', type: 'word', choices: ['いぬ', 'ねこ', 'ぞう'], answer: 'ねこ' },
    play:   { voice: 'kq_play',   text: 'うさぎは なんびき？',    type: 'word', pic: 'count', choices: ['3', '6', '9'], answer: '6' },
    tosho:  { voice: 'kq_tosho',  text: 'この どうぶつの なまえは？',  type: 'word', pic: 'kirin', choices: ['きつね', 'きりん', 'りんご'], answer: 'きりん' },
  },
};
// =====================================================================

const $ = s => document.querySelector(s);
const main = $('#main');
let S = null; // { course, route, step, pieces }
let lastVoice = null;

// ---------- おと ----------
const player = new Audio();
player.preload = 'auto';
let unlocked = false;
document.addEventListener('pointerdown', () => {
  if (unlocked) return; unlocked = true;
  if (!player.src) { player.src = VOICE.title; player.muted = true; player.play().then(() => { player.pause(); player.muted = false; }).catch(() => { player.muted = false; }); }
}, { once: false, capture: true });
function speak(key) {
  if (!key || !VOICE[key]) return;
  lastVoice = key;
  try { player.pause(); player.muted = false; player.src = VOICE[key]; player.currentTime = 0;
    const p = player.play(); if (p) p.catch(() => {}); } catch (e) {}
}
player.addEventListener('play', () => document.querySelectorAll('.speak').forEach(b => b.classList.add('playing')));
['pause', 'ended'].forEach(ev => player.addEventListener(ev, () => document.querySelectorAll('.speak').forEach(b => b.classList.remove('playing'))));
function speakBtn(key) { const b = document.createElement('button'); b.className = 'speak'; b.textContent = '🔊'; b.setAttribute('aria-label', 'きく'); b.onclick = () => speak(key); return b; }

// ---------- ほぞん ----------
function save() { try { localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(S)); } catch (e) {} }
function load() { try { return JSON.parse(localStorage.getItem(CONFIG.SAVE_KEY)); } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {} }

// ---------- べんり ----------
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function h(html) { main.innerHTML = html; main.scrollTop = 0; }
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function target() { return S.step < ROUTE_PLACES.length ? S.route[S.step] : 'nikoniko'; }
function puzzleHTML(newIdx = -1) {
  return `<div class="puzzle">${[0, 1, 2, 3].map(i => S.pieces.includes(i) ? `<div class="${i === newIdx ? 'pop' : ''}">${PIECES[i]}</div>` : `<div>？</div>`).join('')}</div>`;
}
function updateHeader() {
  const on = !!S;
  $('#hdr').classList.toggle('show', on);
  document.body.className = on ? S.course : '';
  if (!on) return;
  $('#badge').textContent = S.course === 'kira' ? '⭐ きらきらコース' : '😊 にこにこコース';
  $('#mini').innerHTML = [0, 1, 2, 3].map(i => `<div class="${S.pieces.includes(i) ? 'got' : ''}">${S.pieces.includes(i) ? PIECES[i] : ''}</div>`).join('');
}
const PIECES = [0, 1, 2, 3].map(puzzlePiece);
const COUNT_PIC = countPicture();

// ---------- がめん ----------
function showTitle() {
  S = null; updateHeader();
  const saved = load();
  h(`<h1>どうぶつ なぞとき</h1>
    <div class="animals">${['inu', 'panda', 'zou', 'raion', 'usagi'].map(a => ART[a]).join('')}</div>
    <div class="row">
      <button class="course kira" id="cKira"><div class="ic">⭐</div><b>きらきらコース</b><span>ひらがなを よむ もんだい</span></button>
      <button class="course nico" id="cNico"><div class="ic">😊</div><b>にこにこコース</b><span>こえを きいて えを えらぶ</span></button>
    </div>
    ${saved ? `<button class="big-btn sub" id="cont">▶ つづきから（${saved.course === 'kira' ? 'きらきら' : 'にこにこ'}・ピース ${saved.pieces.length}こ）</button>` : ''}
    <div class="credit">${CONFIG.CREDIT}</div>`);
  const sp = speakBtn('title'); main.querySelector('h1').after(sp);
  $('#cKira').onclick = () => start('kira');
  $('#cNico').onclick = () => start('nico');
  if (saved) $('#cont').onclick = () => { S = saved; resume(); };
  lastVoice = 'title';
}
function start(course) {
  S = { course, route: shuffle(ROUTE_PLACES), step: 0, pieces: [], arrived: false };
  save(); updateHeader();
  h(`<h2>どうぶつの パズルの ピースを<br>４つ あつめよう！</h2>
     ${puzzleHTML()}
     <p class="sub">ぜんぶ あつめたら にこにこルームに もどってきてね</p>
     <button class="big-btn" id="go">スタート ▶</button>`);
  main.prepend(speakBtn('intro'));
  speak('intro');
  $('#go').onclick = () => showGo(true);
}
function resume() {
  updateHeader();
  if (S.arrived) arrive(); else showGo(false);
}
function showGo(autoplay) {
  S.arrived = false; save(); updateHeader();
  const t = target(), P = PLACES[t];
  const final = t === 'nikoniko';
  const art = PLACE_ART[t];
  h(`${final ? '<h2 class="ok-title">パズルが ぜんぶ そろったね！</h2>' : `<p class="sub">${S.step === 0 ? 'さいしょは' : 'つぎは'}</p>`}
     <div class="place-pic">${art}</div>
     <h2><span style="color:var(--theme)">${P.name}</span>に いこう！</h2>
     <div class="row" id="acts"></div>
     <button class="small-link" id="tch">せんせい</button>`);
  const acts = $('#acts');
  acts.append(speakBtn(P.voice));
  const scanB = el('button', 'big-btn', '📷 QRを よみとる'); scanB.onclick = openScan; acts.append(scanB);
  $('#tch').onclick = () => openPad('QRが よめないとき（とうちゃく）', arrive);
  lastVoice = P.voice;
  if (autoplay) speak(P.voice);
}
function arrive() {
  S.arrived = true; save();
  const t = target();
  if (t === 'nikoniko') return showFinal();
  if (t === 'taiiku') return showTunnel();
  showQuestion(t);
}
function showQuestion(t) {
  const Q = QUESTIONS[S.course][t];
  const pic = Q.pic === 'count' ? COUNT_PIC : Q.pic ? ART[Q.pic] : '';
  h(`<p class="sub">${PLACES[t].name}の もんだい</p>
     <div class="qhead"><h2>${Q.text}</h2></div>
     ${pic ? `<div class="qpic">${pic}</div>` : ''}
     <div class="choices" id="ch"></div>`);
  main.querySelector('.qhead').prepend(speakBtn(Q.voice));
  const ch = $('#ch');
  shuffle(Q.choices).forEach(c => {
    const b = el('button', 'choice ' + Q.type, Q.type === 'pic' ? ART[c] : c); b.dataset.c = c;
    b.onclick = () => {
      if (c === Q.answer) { b.classList.add('yes'); ch.querySelectorAll('.choice').forEach(x => x.style.pointerEvents = 'none'); setTimeout(() => getPiece(t, 'correct'), 500); }
      else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); speak('wrong'); setTimeout(() => b.classList.add('no'), 450); }
    };
    ch.append(b);
  });
  lastVoice = Q.voice; speak(Q.voice);
}
function showTunnel() {
  h(`<h2>トンネルを くぐろう！</h2>
     <div class="place-pic">${PLACE_ART.taiiku}</div>
     <p class="sub">くぐれたら せんせいに みせてね</p>
     <div class="row" id="acts"></div>`);
  const acts = $('#acts');
  acts.append(speakBtn('tunnel'));
  const b = el('button', 'big-btn', '✅ せんせい コード'); b.onclick = () => openPad('トンネル せいこう！', () => getPiece('taiiku', 'tunnel_ok')); acts.append(b);
  lastVoice = 'tunnel'; speak('tunnel');
}
function getPiece(t, voice) {
  const idx = PLACES[t].piece;
  if (!S.pieces.includes(idx)) S.pieces.push(idx);
  S.step++; S.arrived = false; save(); updateHeader();
  h(`<h2 class="ok-title">${t === 'taiiku' ? 'やったね！' : 'せいかい！'}</h2>
     <p class="sub">パズルの ピースを ゲット！</p>
     ${puzzleHTML(idx)}
     <button class="big-btn" id="next">つぎへ ▶</button>`);
  main.prepend(speakBtn(voice));
  speak(voice);
  $('#next').onclick = () => showGo(true);
}
function showFinal() {
  h(`<h2>にこにこルームに ついたね！</h2>
     ${puzzleHTML()}
     <p class="sub">せんせいに コードを いれてもらおう</p>
     <div class="row" id="acts"></div>`);
  const acts = $('#acts');
  acts.append(speakBtn('final'));
  const b = el('button', 'big-btn', '🔓 せんせい コード'); b.onclick = () => openPad('かいじょ コード', showClear); acts.append(b);
  lastVoice = 'final'; speak('final');
}
function showClear() {
  clearSave();
  h(`<h1 class="ok-title">ゲームクリア！</h1>
     ${puzzleHTML()}
     <h2>おめでとう！</h2>
     <button class="big-btn sub" id="end">おわる</button>`);
  main.prepend(speakBtn('clear'));
  speak('clear'); confetti();
  $('#end').onclick = () => { document.querySelector('.confetti')?.remove(); showTitle(); };
}
function confetti() {
  const c = el('div', 'confetti'); const cols = ['#ff6b9b', '#ffb020', '#38b46b', '#6fb6ff', '#b07cff'];
  for (let i = 0; i < 80; i++) { const p = el('i'); p.style.left = Math.random() * 100 + 'vw'; p.style.background = cols[i % 5];
    p.style.animationDuration = 2.5 + Math.random() * 3 + 's'; p.style.animationDelay = Math.random() * 2 + 's'; c.append(p); }
  document.body.append(c);
}
function toast(msg) { const t = el('div', 'toast', msg); document.body.append(t); setTimeout(() => t.remove(), 2600); }

// ---------- QR よみとり ----------
let stream = null, scanning = false;
const video = $('#video'), cv = $('#cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
async function openScan() {
  $('#scan').classList.add('show');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
    video.srcObject = stream; await video.play(); scanning = true; requestAnimationFrame(tick);
  } catch (e) { closeScan(); toast('カメラが つかえません'); }
}
function closeScan() { scanning = false; $('#scan').classList.remove('show'); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; }
$('#scanClose').onclick = closeScan;
let lastTick = 0;
function tick(ts) {
  if (!scanning) return;
  if (ts - lastTick > 120 && video.readyState >= 2) {
    lastTick = ts;
    const w = video.videoWidth, hh = video.videoHeight, sc = Math.min(1, 720 / Math.max(w, hh));
    cv.width = w * sc; cv.height = hh * sc; ctx.drawImage(video, 0, 0, cv.width, cv.height);
    const img = ctx.getImageData(0, 0, cv.width, cv.height);
    const r = jsQR(img.data, img.width, img.height, { inversionAttempts: 'dontInvert' });
    if (r && r.data) { closeScan(); onCode(r.data.trim()); return; }
  }
  requestAnimationFrame(tick);
}
function onCode(txt) {
  const place = txt.startsWith(CONFIG.QR_PREFIX) ? txt.slice(CONFIG.QR_PREFIX.length) : null;
  if (place === target()) { arrive(); return; }
  toast(place && PLACES[place] ? `ここは ${PLACES[place].name}だよ` : 'この QRは ちがうよ');
  speak('wrong_place');
}

// ---------- せんせい コード ----------
let padCb = null, padVal = '';
const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '←', '0', 'OK'];
$('#padKeys').innerHTML = keys.map(k => `<button data-k="${k}" class="${k === 'OK' ? 'okk' : ''}">${k}</button>`).join('');
$('#padKeys').onclick = e => {
  const k = e.target.dataset && e.target.dataset.k; if (!k) return;
  if (k === '←') padVal = padVal.slice(0, -1);
  else if (k === 'OK') {
    if (padVal === CONFIG.TEACHER_CODE) { const cb = padCb; closePad(); cb && cb(); return; }
    $('#padErr').textContent = 'ちがいます'; padVal = '';
  } else if (padVal.length < 8) { padVal += k; $('#padErr').textContent = ''; }
  $('#padDisp').textContent = '●'.repeat(padVal.length);
};
function openPad(title, cb) { padCb = cb; padVal = ''; $('#padTitle').textContent = title; $('#padDisp').textContent = ''; $('#padErr').textContent = ''; $('#pad').classList.add('show'); }
function closePad() { $('#pad').classList.remove('show'); padCb = null; }
$('#padCancel').onclick = closePad;

showTitle();
</script>
